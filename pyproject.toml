[project]
name = "padeldet"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "rfdetr>=1.7.1",
    "supervision>=0.18.0",
    "boxmot>=19.0.0,<20.0.0",  # pinned: 22.x reorganized tracker module paths (breaks DeepOcSort import) — see CV-001 in BUGS.md
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "modal>=1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["padeldet"]
